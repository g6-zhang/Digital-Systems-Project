<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Profile - Roe's Zoo</title>
<link href="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.css" rel="stylesheet"/>
<script src="https://unpkg.com/cropperjs@1.5.13/dist/cropper.min.js"></script>
<style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #f0fff0, #e6f5e6);
      color: #333;
    }

    header {
      background: linear-gradient(to right, #2a9d8f, #228b22);
      color: white;
      padding: 13px;
      text-align: center;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #logo-container img {
      width: 30px;
      height: auto;
    }

    #logo-container h1 {
      font-size: 24px;
      font-weight: bold;
      font-family: 'Georgia', serif;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      padding: 6px 10px;
      background-color: #32cd32;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    nav ul li a:hover {
      background-color: #1e7969;
      transform: scale(1.1);
    }

    #user-profile {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 120px;
      margin-bottom: 40px;
    }

    .avatar-box {
      text-align: center;
      background-color: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      max-width: 360px;
      width: 90%;
    }

    .avatar-box form,
    .avatar-box button {
      margin-top: 10px;
      margin-bottom: 10px;
    }

    .avatar-box input[type="text"],
    .avatar-box input[type="password"] {
      width: 220px;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin: 8px auto;
      display: block;
    }

    .avatar-box button {
      width: 110px;
      padding: 8px 0;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      background-color: #4a90e2;
      color: white;
      font-weight: bold;
      margin: 8px auto;
      display: block;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .avatar-box button:hover {
      background-color: #357ab8;
      transform: scale(1.03);
    }

    .avatar-wrapper {
      position: relative;
      display: inline-block;
    }

    .avatar-wrapper img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid #2a9d8f;
    }

    .upload-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background-color: #2a9d8f;
      color: white;
      padding: 6px;
      font-size: 12px;
      border-radius: 50%;
      cursor: pointer;
    }

    footer {
      background-color: #264653;
      color: white;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
    }
  
    #crop-modal {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: white;
  padding: 24px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
  z-index: 9999;
  border-radius: 14px;
  width: 360px;
  max-width: 90%;
  text-align: center;
}

#crop-modal h3 {
  margin-bottom: 14px;
  font-size: 20px;
  color: #2a9d8f;
}

#crop-image {
  width: 300px;
  height: auto;
  max-height: 300px;
  border-radius: 6px;
  box-shadow: 0 0 6px rgba(0,0,0,0.1);
}

.button-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 15px;
}

.modal-btn {
  padding: 8px 16px;
  font-size: 14px;
  border-radius: 6px;
  cursor: pointer;
  border: none;
}

.modal-btn.primary {
  background-color: #2a9d8f;
  color: white;
}

.modal-btn.secondary {
  background-color: #ccc;
  color: #333;
}

.feedback-button {
    position: fixed;
    bottom: 80px; 
    right: 30px;
    background-color: #28a745;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    z-index: 999;
    transition: background-color 0.3s ease;
}

.feedback-button:hover {
    background-color: #218838;
}

</style>
</head>
<body>
<header>
<div id="logo-container">
<img alt="Zoo Logo" src="images/logo.jpg"/>
<h1>Roe's Zoo</h1>
</div>
<nav>
<ul>
<li><a href="/profile">User</a></li>
<li><a href="/home">Home</a></li>
<li><a href="/animals2">Animal Introduction</a></li>
<li><a href="/map2">Map</a></li>
<li><a href="/tickets2">Tickets</a></li>
</ul>
</nav>
</header>
<section id="user-profile">
<div class="avatar-box">
<div class="avatar-wrapper">
<img id="avatar" src="{{ user.avatar_url or '/static/avatars/default.jpg' }}" alt="User Avatar" class="avatar-img">
<label class="upload-btn" for="avatarInput">📤</label>
<input accept="image/*" id="avatarInput" style="display:none;" type="file"/>
</div>
<h2 id="username" style="color: teal; margin: 10px 0;">Welcome back!</h2>
<form id="updateForm">
<input name="full_name" placeholder="New Name" required="" type="text"/>
<button type="submit">Update Name</button>
</form>
<form id="passwordForm">
<input name="old_password" placeholder="Old Password" required="" type="password"/>
<input name="new_password" placeholder="New Password" required="" type="password"/>
<button type="submit">Change Password</button>
</form>
<button onclick="window.location.href='/logout'">Logout</button>
</div>
</section>
<footer>
<p>© 2025 Roe's Zoo. All rights reserved.</p>
</footer>

<div id="crop-modal">
<h3>Crop your avatar</h3>
<img id="crop-image"/>
<div class="button-row">
<button class="modal-btn primary" id="crop-confirm">Upload</button>
<button class="modal-btn secondary" onclick="document.getElementById('crop-modal').style.display='none'" type="button">Cancel</button>
</div>
</div>

<script>
  fetch("/user/me")
    .then(res => res.json())
    .then(data => {
      document.getElementById("username").innerText = "Welcome back, " + data.full_name + "!";
      const avatarUrl = data.avatar_url || "/static/avatars/default.jpg";
      document.getElementById("avatar").src = avatarUrl;
    })
    .catch(() => {
      document.getElementById("username").innerText = "Welcome back!";
    });

  document.getElementById("updateForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const name = this.full_name.value;
    const res = await fetch("/user/update", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ full_name: name })
    });
    if (res.ok) {
      alert("Name updated!");
      location.reload();
    } else {
      alert("Update failed.");
    }
  });

  document.getElementById("passwordForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const res = await fetch("/user/change-password", {
      method: "POST",
      body: formData
    });
    if (res.ok) {
      alert("Password changed successfully!");
      this.reset();
    } else {
      const result = await res.json();
      alert(result.detail || "Change failed.");
    }
  });

  let cropper;

  document.getElementById("avatarInput").addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
      const image = document.getElementById("crop-image");
      image.src = e.target.result;
      document.getElementById("crop-modal").style.display = "block";

      if (cropper) cropper.destroy();
      cropper = new Cropper(image, {
        aspectRatio: 1,
        viewMode: 1,
        autoCropArea: 1,
        responsive: true,
        background: false
      });

      document.getElementById("crop-confirm").onclick = async function () {
      try {
        const canvas = cropper.getCroppedCanvas({ width: 300, height: 300 });
        if (!canvas) {
          alert("⚠️ Invalid crop area. Please select a valid region.");
          return;
        }

        canvas.toBlob(async function (blob) {
          if (!blob) {
            alert("⚠️ Failed to crop. No image data generated.");
            return;
          }

          const formData = new FormData();
          formData.append("avatar", blob, "avatar.png");

          console.log("📤 Uploading avatar...");

          const response = await fetch("/upload-avatar", {
            method: "POST",
            body: formData
          });

          const result = await response.json();
          console.log("🧾 Server response:", result);

          if (response.ok && result.avatar_url) {
            document.getElementById("avatar").src = result.avatar_url + "?t=" + new Date().getTime();
            alert("✅ Avatar uploaded successfully!");
          } else {
            alert("❌ Upload failed: " + (result.detail || "Unknown error"));
          }

          document.getElementById("crop-modal").style.display = "none";
          cropper.destroy();
        }, "image/png");
      } catch (err) {
        console.error("❗ Error during upload:", err);
        alert("❗ An error occurred during upload. Please check the console.");
      }
    };
  };

    reader.readAsDataURL(file);
  });
</script>

<a href="/feedback" class="feedback-button">Feedback</a>

</body>
</html>
