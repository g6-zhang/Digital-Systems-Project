<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>User Feedback</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <style>
    .feedback-container {
      max-width: 600px;
      margin: 80px auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 150px;
      resize: none;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
    }
    .submit-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #45a049;
    }
    .back-button {
      display: block;
      position: absolute;
      bottom: 100px; 
      right: 40px;
      padding: 10px 20px;
      background-color: #dc3545;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 5px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.3s ease;
    }

    .back-button:hover {
      background-color: #bb2d3b;
    }
  </style>
</head>
<body>
  <div class="feedback-container">
    <h2>Submit Your Feedback</h2>
    <p>Your name will not be recorded. Feel free to leave any suggestions or report issues!</p>
    <form method="post" action="/feedback">
      <textarea name="feedback" placeholder="Write your feedback here..." required></textarea>
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>

  <a href="/profile" class="back-button">Back</a>

</body>
</html>
