<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #f0fff0, #e6f5e6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .register-box {
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 450px;
    }
    .register-box h2 {
      margin-bottom: 25px;
      color: #2a9d8f;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }
    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 18px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    .checkbox-container {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .checkbox-container input {
      margin-right: 8px;
    }
    .register-box button {
      width: 100%;
      background-color: #2a9d8f;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .register-box button:hover {
      background-color: #1e7969;
    }
    .register-box .links {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }
    .register-box .links a,
    .register-box .checkbox-container a {
      color: #2a9d8f;
      text-decoration: none;
    }
    .register-box .links a:hover,
    .register-box .checkbox-container a:hover {
      color: #1e7969;
    }
    .message {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="register-box">
    <h2>Create an Account</h2>
    <form id="register-form">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required />

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required />

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required />

      <div class="checkbox-container">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">
          I agree to the 
          <a href="#">Terms of Service</a> and 
          <a href="#">Privacy Policy</a>
        </label>
      </div>

      <button type="submit">Create Account</button>
    </form>

    <div class="message" id="message"></div>

    <div class="links">
      <p>Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <script>
    document.getElementById("register-form").addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullname = document.getElementById("fullname").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm_password").value;
      const message = document.getElementById("message");

      if (password !== confirm) {
        message.style.color = "red";
        message.innerText = "Passwords do not match.";
        return;
      }

      const response = await fetch("http://localhost:8080/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          full_name: fullname,
          email: email,
          password: password
        })
      });

      const result = await response.json();
      if (response.ok) {
        message.style.color = "green";
        message.innerText = "Registration successful!";
      } else {
        message.style.color = "red";
        message.innerText = result.detail || "Registration failed.";
      }
    });
  </script>
</body>
</html>
