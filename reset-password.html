<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Roe's Zoo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to bottom, #f0fff0, #e6f5e6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .reset-box {
      background-color: #fff;
      padding: 30px 40px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .reset-box h2 {
      margin-bottom: 25px;
      color: #2a9d8f;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #333;
    }

    input[type="email"],
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .reset-box .tip {
      font-size: 12px;
      margin-top: -10px;
      margin-bottom: 15px;
      color: #888;
    }

    .reset-box button {
      width: 100%;
      background-color: #2a9d8f;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .reset-box button:hover {
      background-color: #1e7969;
    }

    .reset-box .links {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
    }

    .reset-box .links a {
      color: #2a9d8f;
      text-decoration: none;
      margin: 0 8px;
    }

    .reset-box .links a:hover {
      color: #1e7969;
    }

    .message {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="reset-box">
    <h2>Reset Your Password</h2>
    <form id="reset-form">
      <label for="email">Email address</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" placeholder="Enter your full name" required />
      <p class="tip">Enter your full name exactly as you entered during registration.</p>

      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" required />
      <p class="tip">Use at least 8 characters with a mix of letters, numbers & symbols.</p>

      <label for="confirmPassword">Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" required />

      <button type="submit">Reset Password</button>
    </form>

    <div class="message" id="message"></div>

    <div class="links">
      <p><a href="/login">Back to Login</a></p>
    </div>
  </div>

  <script>
    document.getElementById("reset-form").addEventListener("submit", async function(event) {
      event.preventDefault();
  
      const email = document.getElementById("email").value;
      const fullname = document.getElementById("fullname").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("message");
  
      if (newPassword !== confirmPassword) {
        message.style.color = "red";
        message.innerText = "Passwords do not match.";
        return;
      }
  
      const response = await fetch("/reset-password", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          email: email,
          full_name: fullname,
          new_password: newPassword,
          confirm_password: confirmPassword
        })
      });
  
      const result = await response.json();
      if (response.ok) {
        message.style.color = "green";
        message.innerText = "Password reset successful!";
      } else {
        message.style.color = "red";
        message.innerText = result.detail || "Password reset failed.";
      }
    });
  </script>
  
</body>
</html>
